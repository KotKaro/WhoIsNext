name: Tests

on:
  pull_request:
  push:
    # main is tested by deploy.yml, which runs this workflow before deploying.
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      # Bundles the Worker and reads wrangler.toml without deploying or logging in.
      - run: npx wrangler deploy --dry-run
